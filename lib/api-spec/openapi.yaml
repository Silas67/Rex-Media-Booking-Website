openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: booking
    description: Booking email notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /booking-confirmation:
    post:
      operationId: sendBookingConfirmation
      tags: [booking]
      summary: Send the confirmation email for a saved booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingConfirmationRequest"
      responses:
        "200":
          description: Confirmation email accepted by the email provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfirmationSent"
        "400":
          description: Invalid booking confirmation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking receipt token is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Confirmation is already being sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email or booking-service configuration is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BookingConfirmationRequest:
      type: object
      additionalProperties: false
      properties:
        bookingId:
          type: string
          format: uuid
        confirmationToken:
          type: string
          pattern: "^[0-9a-f]{64}$"
          minLength: 64
          maxLength: 64
      required: [bookingId, confirmationToken]
    BookingConfirmationSent:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [sent]
      required: [status]
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

